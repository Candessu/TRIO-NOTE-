          package com.syritis.trio

          import android.app.Activity
          import android.app.AlertDialog
          import android.appwidget.AppWidgetManager
          import android.content.ComponentName
          import android.content.ContentValues
          import android.content.Intent
          import android.graphics.Color
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Environment
          import android.provider.MediaStore
          import android.provider.Settings
          import android.view.View
          import android.webkit.JavascriptInterface
          import android.webkit.JsResult
          import android.webkit.ValueCallback
          import android.webkit.WebChromeClient
          import android.webkit.WebResourceRequest
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.Toast
          import java.io.File

          class MainActivity : Activity() {
              private lateinit var web: WebView
              private var fcb: ValueCallback<Array<Uri>>? = null

              inner class Bridge {
                  @JavascriptInterface
                  fun saveBackup(name: String, json: String) {
                      val ok = try {
                          val safe = name.replace(Regex("[^A-Za-z0-9._-]"), "_")
                          if (Build.VERSION.SDK_INT >= 29) {
                              val v = ContentValues()
                              v.put(MediaStore.Downloads.DISPLAY_NAME, safe)
                              v.put(MediaStore.Downloads.MIME_TYPE, "application/json")
                              v.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS)
                              val u = contentResolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v)
                              if (u == null) {
                                  false
                              } else {
                                  contentResolver.openOutputStream(u)?.use { it.write(json.toByteArray(Charsets.UTF_8)) }
                                  true
                              }
                          } else {
                              val dir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS)
                              dir.mkdirs()
                              File(dir, safe).writeText(json)
                              true
                          }
                      } catch (e: Exception) {
                          false
                      }
                      if (!ok) runOnUiThread { Toast.makeText(this@MainActivity, "Échec de la sauvegarde", Toast.LENGTH_LONG).show() }
                  }

                  @JavascriptInterface
                  fun pinWidget() {
                      runOnUiThread {
                          try {
                              val m = AppWidgetManager.getInstance(this@MainActivity)
                              if (m.isRequestPinAppWidgetSupported) {
                                  m.requestPinAppWidget(ComponentName(this@MainActivity, AgendaWidget::class.java), null, null)
                              } else {
                                  Toast.makeText(this@MainActivity, "Appui long sur l'écran d'accueil, puis Widgets, puis Mon Trio", Toast.LENGTH_LONG).show()
                              }
                          } catch (e: Exception) {
                              Toast.makeText(this@MainActivity, "Appui long sur l'écran d'accueil, puis Widgets, puis Mon Trio", Toast.LENGTH_LONG).show()
                          }
                      }
                  }

                  @JavascriptInterface
                  fun setBars(top: String, bottom: String, lightNav: Boolean) {
                      runOnUiThread {
                          try {
                              window.statusBarColor = Color.parseColor(top)
                              window.navigationBarColor = Color.parseColor(bottom)
                              var f = window.decorView.systemUiVisibility
                              f = if (lightNav) f or View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR else f and View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR.inv()
                              window.decorView.systemUiVisibility = f
                          } catch (e: Exception) {}
                      }
                  }

                  @JavascriptInterface
                  fun agendaAll(json: String) {
                      getSharedPreferences("trio", MODE_PRIVATE).edit().putString("agenda", json).apply()
                      AgendaWidget.updateAll(this@MainActivity)
                  }

                  @JavascriptInterface
                  fun setReminder(json: String) {
                      getSharedPreferences("trio", MODE_PRIVATE).edit().putString("rm", json).apply()
                      Reminder.schedule(this@MainActivity)
                  }

                  @JavascriptInterface
                  fun listSounds(): String {
                      return Reminder.list(this@MainActivity)
                  }

                  @JavascriptInterface
                  fun testSound(json: String) {
                      runOnUiThread { Reminder.play(this@MainActivity, json, null) }
                  }

                  @JavascriptInterface
                  fun nextReminder(): String {
                      return Reminder.nextLabel(this@MainActivity)
                  }

                  @JavascriptInterface
                  fun diag(): String {
                      return Reminder.diag(this@MainActivity)
                  }

                  @JavascriptInterface
                  fun askBattery() {
                      runOnUiThread {
                          try {
                              val i = Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS)
                              i.data = Uri.parse("package:" + packageName)
                              startActivity(i)
                          } catch (e: Exception) {
                              try {
                                  startActivity(Intent(Settings.ACTION_IGNORE_BATTERY_OPTIMIZATION_SETTINGS))
                              } catch (e2: Exception) {}
                          }
                      }
                  }
              }

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  window.statusBarColor = Color.parseColor("#1E6FD9")
                  web = WebView(this)
                  setContentView(web)
                  val s = web.settings
                  s.javaScriptEnabled = true
                  s.domStorageEnabled = true
                  s.allowFileAccess = true
                  s.allowContentAccess = true
                  web.addJavascriptInterface(Bridge(), "Android")
                  web.webViewClient = object : WebViewClient() {
                      override fun shouldOverrideUrlLoading(v: WebView?, r: WebResourceRequest?): Boolean {
                          val u = r?.url ?: return false
                          if (u.scheme == "file") return false
                          try { startActivity(Intent(Intent.ACTION_VIEW, u)) } catch (e: Exception) {}
                          return true
                      }
                  }
                  web.webChromeClient = object : WebChromeClient() {
                      override fun onJsAlert(view: WebView?, url: String?, message: String?, result: JsResult?): Boolean {
                          AlertDialog.Builder(this@MainActivity)
                              .setMessage(message)
                              .setPositiveButton("OK") { _, _ -> result?.confirm() }
                              .setOnCancelListener { result?.cancel() }
                              .show()
                          return true
                      }

                      override fun onJsConfirm(view: WebView?, url: String?, message: String?, result: JsResult?): Boolean {
                          AlertDialog.Builder(this@MainActivity)
                              .setMessage(message)
                              .setPositiveButton("OK") { _, _ -> result?.confirm() }
                              .setNegativeButton("Annuler") { _, _ -> result?.cancel() }
                              .setOnCancelListener { result?.cancel() }
                              .show()
                          return true
                      }

                      override fun onShowFileChooser(
                          webView: WebView?,
                          filePathCallback: ValueCallback<Array<Uri>>?,
                          fileChooserParams: WebChromeClient.FileChooserParams?
                      ): Boolean {
                          fcb?.onReceiveValue(null)
                          fcb = filePathCallback
                          return try {
                              startActivityForResult(fileChooserParams?.createIntent(), 11)
                              true
                          } catch (e: Exception) {
                              fcb = null
                              false
                          }
                      }
                  }
                  web.loadUrl("file:///android_asset/index.html")
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  if (requestCode == 11) {
                      fcb?.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(resultCode, data))
                      fcb = null
                  } else {
                      super.onActivityResult(requestCode, resultCode, data)
                  }
              }

              override fun onResume() {
                  super.onResume()
                  AgendaWidget.updateAll(this)
                  Reminder.schedule(this)
              }

              override fun onBackPressed() {
                  moveTaskToBack(true)
              }
          }
