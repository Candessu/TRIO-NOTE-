          package com.syritis.trio

          import android.app.AlarmManager
          import android.app.PendingIntent
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.media.AudioAttributes
          import android.media.AudioManager
          import android.media.MediaPlayer
          import android.media.RingtoneManager
          import android.media.ToneGenerator
          import android.net.Uri
          import android.os.Build
          import android.os.Handler
          import android.os.Looper
          import android.os.PowerManager
          import org.json.JSONArray
          import org.json.JSONObject
          import java.util.Calendar

          object Reminder {
              private val BUILTIN = listOf(
                  "Bip doux" to ToneGenerator.TONE_PROP_BEEP,
                  "Double bip" to ToneGenerator.TONE_PROP_BEEP2,
                  "Confirmation" to ToneGenerator.TONE_PROP_ACK,
                  "Invite" to ToneGenerator.TONE_PROP_PROMPT,
                  "Pip court" to ToneGenerator.TONE_SUP_PIP,
                  "Pip réseau" to ToneGenerator.TONE_CDMA_PIP,
                  "Alerte légère" to ToneGenerator.TONE_CDMA_ALERT_NETWORK_LITE
              )

              private fun cfg(c: Context): JSONObject = try {
                  JSONObject(c.getSharedPreferences("trio", Context.MODE_PRIVATE).getString("rm", "{}") ?: "{}")
              } catch (e: Exception) {
                  JSONObject()
              }

              private fun mins(s: String, d: Int): Int = try {
                  val p = s.split(":")
                  p[0].toInt() * 60 + p[1].toInt()
              } catch (e: Exception) {
                  d
              }

              fun nextTime(c: Context): Long {
                  val j = cfg(c)
                  if (j.optInt("on", 0) != 1) return -1
                  val st = mins(j.optString("st", "05:30"), 330)
                  val en = mins(j.optString("en", "23:00"), 1380)
                  val ev = j.optInt("ev", 60).coerceAtLeast(10)
                  val now = System.currentTimeMillis() + 1000
                  val first = ((st + ev - 1) / ev) * ev
                  for (day in 0..1) {
                      var t = first
                      while (t <= en) {
                          val cal = Calendar.getInstance()
                          cal.set(Calendar.HOUR_OF_DAY, 0)
                          cal.set(Calendar.MINUTE, 0)
                          cal.set(Calendar.SECOND, 0)
                          cal.set(Calendar.MILLISECOND, 0)
                          cal.add(Calendar.DAY_OF_YEAR, day)
                          cal.add(Calendar.MINUTE, t)
                          if (cal.timeInMillis > now) return cal.timeInMillis
                          t += ev
                      }
                  }
                  return -1
              }

              private fun pending(c: Context): PendingIntent {
                  val i = Intent(c, ReminderReceiver::class.java).setAction("com.syritis.trio.REMINDER")
                  return PendingIntent.getBroadcast(c, 77, i, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
              }

              fun schedule(c: Context) {
                  val am = c.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                  val pi = pending(c)
                  am.cancel(pi)
                  val t = nextTime(c)
                  if (t < 0) return
                  try {
                      val show = PendingIntent.getActivity(
                          c, 78, Intent(c, MainActivity::class.java),
                          PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                      )
                      am.setAlarmClock(AlarmManager.AlarmClockInfo(t, show), pi)
                  } catch (e: Exception) {
                      try {
                          am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, t, pi)
                      } catch (e2: Exception) {
                          try { am.set(AlarmManager.RTC_WAKEUP, t, pi) } catch (e3: Exception) {}
                      }
                  }
              }

              fun nextLabel(c: Context): String {
                  val t = nextTime(c)
                  if (t < 0) return ""
                  val cal = Calendar.getInstance()
                  cal.timeInMillis = t
                  val today = Calendar.getInstance()
                  val same = today.get(Calendar.DAY_OF_YEAR) == cal.get(Calendar.DAY_OF_YEAR)
                  val h = String.format("%02dh%02d", cal.get(Calendar.HOUR_OF_DAY), cal.get(Calendar.MINUTE))
                  return (if (same) "aujourd'hui " else "demain ") + h
              }

              fun diag(c: Context): String {
                  val o = JSONObject()
                  try {
                      val pm = c.getSystemService(Context.POWER_SERVICE) as PowerManager
                      o.put("bat", pm.isIgnoringBatteryOptimizations(c.packageName))
                      val am = c.getSystemService(Context.AUDIO_SERVICE) as AudioManager
                      o.put("vol", am.getStreamVolume(AudioManager.STREAM_ALARM))
                      o.put("max", am.getStreamMaxVolume(AudioManager.STREAM_ALARM))
                  } catch (e: Exception) {}
                  return o.toString()
              }

              fun list(c: Context): String {
                  val a = JSONArray()
                  BUILTIN.forEachIndexed { i, p ->
                      a.put(JSONObject().put("id", "tone:$i").put("n", "Bip · " + p.first))
                  }
                  try {
                      val rm = RingtoneManager(c)
                      rm.setType(RingtoneManager.TYPE_NOTIFICATION or RingtoneManager.TYPE_ALARM)
                      val cur = rm.cursor
                      var n = 0
                      while (cur.moveToNext() && n < 60) {
                          val t = cur.getString(RingtoneManager.TITLE_COLUMN_INDEX)
                          val u = rm.getRingtoneUri(cur.position)
                          a.put(JSONObject().put("id", "uri:$u").put("n", t))
                          n++
                      }
                  } catch (e: Exception) {}
                  return a.toString()
              }

              fun play(c: Context, json: String, done: (() -> Unit)?) {
                  val j = try { JSONObject(json) } catch (e: Exception) { JSONObject() }
                  val snd = j.optString("snd", "tone:0")
                  val dur = j.optInt("dur", 700).coerceIn(200, 3000)
                  val vol = j.optInt("vol", 60).coerceIn(1, 100)
                  val h = Handler(Looper.getMainLooper())
                  val audio = c.getSystemService(Context.AUDIO_SERVICE) as AudioManager
                  var oldVol = -1
                  try {
                      oldVol = audio.getStreamVolume(AudioManager.STREAM_ALARM)
                      val max = audio.getStreamMaxVolume(AudioManager.STREAM_ALARM)
                      val lvl = Math.round(max * vol / 100f).coerceIn(1, max)
                      audio.setStreamVolume(AudioManager.STREAM_ALARM, lvl, 0)
                  } catch (e: Exception) {}
                  var finished = false
                  val finish = {
                      if (!finished) {
                          finished = true
                          try {
                              if (oldVol >= 0) audio.setStreamVolume(AudioManager.STREAM_ALARM, oldVol, 0)
                          } catch (e: Exception) {}
                          done?.invoke()
                      }
                  }
                  h.postDelayed({ finish() }, dur + 4000L)
                  try {
                      if (snd.startsWith("uri:")) {
                          val mp = MediaPlayer()
                          val v = 1.0f
                          val stop = {
                              try { mp.stop() } catch (e: Exception) {}
                              try { mp.release() } catch (e: Exception) {}
                              finish()
                          }
                          mp.setAudioAttributes(
                              AudioAttributes.Builder()
                                  .setUsage(AudioAttributes.USAGE_ALARM)
                                  .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                                  .build()
                          )
                          mp.setDataSource(c, Uri.parse(snd.substring(4)))
                          mp.setVolume(v, v)
                          mp.setOnPreparedListener {
                              it.start()
                              h.postDelayed({ stop() }, dur.toLong())
                          }
                          mp.setOnErrorListener { _, _, _ -> stop(); true }
                          mp.prepareAsync()
                      } else {
                          val idx = snd.removePrefix("tone:").toIntOrNull() ?: 0
                          val type = BUILTIN[idx.coerceIn(0, BUILTIN.size - 1)].second
                          val tg = ToneGenerator(AudioManager.STREAM_ALARM, 100)
                          tg.startTone(type, dur)
                          h.postDelayed({
                              try { tg.release() } catch (e: Exception) {}
                              finish()
                          }, dur + 300L)
                      }
                  } catch (e: Exception) {
                      finish()
                  }
              }
          }

          class ReminderReceiver : BroadcastReceiver() {
              override fun onReceive(c: Context, i: Intent?) {
                  val pr = goAsync()
                  val wl = (c.getSystemService(Context.POWER_SERVICE) as PowerManager)
                      .newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "trio:rappel")
                  try { wl.acquire(10000) } catch (e: Exception) {}
                  Reminder.schedule(c)
                  val j = c.getSharedPreferences("trio", Context.MODE_PRIVATE).getString("rm", "{}") ?: "{}"
                  Reminder.play(c, j) {
                      try { if (wl.isHeld) wl.release() } catch (e: Exception) {}
                      try { pr.finish() } catch (e: Exception) {}
                  }
              }
          }

          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(c: Context, i: Intent?) {
                  Reminder.schedule(c)
              }
          }
